<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Accounts Receivable Command Center</title>
  <desc id="desc">A blue and teal financial operations dashboard mark with AR monogram and aging bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122b47"/>
      <stop offset="1" stop-color="#091727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ed1bb"/>
      <stop offset="1" stop-color="#3aaeff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#bg)"/>
  <path d="M0 292h640M0 246h640M0 200h640M0 154h640M0 108h640" stroke="#27415d" stroke-opacity=".35"/>
  <circle cx="514" cy="112" r="78" fill="none" stroke="#2ed1bb" stroke-opacity=".18" stroke-width="18"/>
  <circle cx="514" cy="112" r="78" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="302 188" transform="rotate(-55 514 112)" filter="url(#glow)"/>
  <circle cx="514" cy="112" r="51" fill="#0c1c2f" stroke="#31506d" stroke-width="2"/>
  <path d="M494 119h39M514 99v39" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
  <text x="52" y="105" fill="#7f9ab6" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">FINANCE OPERATIONS</text>
  <text x="48" y="190" fill="#edf7ff" font-family="Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-5">AR</text>
  <rect x="196" y="128" width="10" height="92" rx="5" fill="#315879"/>
  <rect x="224" y="158" width="10" height="62" rx="5" fill="#f5b75b"/>
  <rect x="252" y="142" width="10" height="78" rx="5" fill="#ff7f72"/>
  <path d="M300 206c34-7 48-31 70-32 19-1 27 17 45 12 16-4 22-27 43-44" fill="none" stroke="#36a9ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="458" cy="142" r="7" fill="#2ed1bb"/>
  <text x="52" y="286" fill="#b4cbe0" font-family="Arial, sans-serif" font-size="22" font-weight="600">COMMAND CENTER</text>
  <text x="52" y="316" fill="#6f8aa5" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">AGING  •  COLLECTIONS  •  CASH RECOVERY</text>
</svg>
